# ICS-TV 送出出力の健全性 (zabbix-agent2 UserParameter)。
# 配置先: /etc/zabbix/zabbix_agent2.d/icstv-playout.conf (Include 済みのディレクトリ)
#
# 判定ロジックと「なぜ age と black の 2 本なのか」は
# deploy/playout-node/scripts/hls-health.sh のヘッダを参照。
#
# キーの引数はチャンネル slug (例: icstv.video.black[ch1])。UnsafeUserParameters は
# 不要 (slug は英数字のみで、既定の禁止文字を含まない)。
UserParameter=icstv.hls.age[*],/usr/local/bin/icstv-hls-health.sh "$1" age
UserParameter=icstv.video.black[*],/usr/local/bin/icstv-hls-health.sh "$1" black
# 休止帯のスレートは黒背景に小さな白文字なので blackdetect では黒と判定される。
# 黒のトリガはこの値が 0 (スレート非表示) であることを条件に加えること。
UserParameter=icstv.slate.active[*],/usr/local/bin/icstv-hls-health.sh "$1" slate
