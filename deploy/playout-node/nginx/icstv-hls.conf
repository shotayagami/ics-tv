# ICS-TV 送出ノード: HLS ABR ladder の静的配信 (#画質切替/音声のみ)。
# icstv-encoder@<slug> が tmpfs /run/icstv-hls/<slug>/ へ master.m3u8 + v0/v1/v2 を書き出し、
# この nginx (:8889) が静的配信する → k8s ingress (tv.yagamin.net/hls2) → Cloudflare。
#
# 既存 MediaMTX HLS (:8888, /hls) とは別ポート・別パスで併存する (MediaMTX leg は poster/生入力で
# 引き続き必要なので温存)。静的ファイルなので MediaMTX のような Cookie/cookieCheck 302 は無く、
# ingress の path 書き換えも不要 (URL /hls2/<slug>/... と tmpfs 構造を一致させている)。
# CF edge でセグメント(.ts)をキャッシュできるのが MediaMTX session HLS には無かった利点。
#
# このファイルは /etc/nginx/conf.d/ に置かれ http{} 内に include される (map は http コンテキスト必須)。

# プレイリスト(.m3u8)はライブ更新されるのでキャッシュ不可。セグメント(.ts)は不変なので短期キャッシュ可
# (CF edge が効いて origin = 送出ノードの負荷を下げる)。
map $uri $icstv_hls_cache {
    default      "no-cache";
    ~\.ts$       "public, max-age=10";
}

server {
    listen 8889;
    server_name _;

    # tmpfs。icstv-encoder@.service の RuntimeDirectory=icstv-hls/%i が mode 0755 で作る。
    # /hls2/<slug>/...  ->  /run/icstv-hls/<slug>/...
    location /hls2/ {
        alias /run/icstv-hls/;

        # .m3u8 / .ts は標準 mime.types に無いので明示する。
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t                    ts;
        }
        default_type application/octet-stream;

        # 公開プレイヤー (hls.js fetch / native HLS) はクロスオリジンで取得する。
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control $icstv_hls_cache always;
    }

    # ヘルス用 (validate.sh / 監視から到達確認)。
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
