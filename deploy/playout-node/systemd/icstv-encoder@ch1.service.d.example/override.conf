# exposure_policy (#27、docs/site-only-broadcast.md §4.6) カットオーバー用の systemd drop-in 例。
# ch1 の icstv-yt-mirror-encoder@ch1 が YouTube ingest 役を引き継いだ後、本線 icstv-encoder@ch1 の
# tee から YouTube leg を外し MediaMTX(HLS) leg のみにする instance 単位の上書き。
#
# 適用方法 (本番未適用。ここに置いてあるだけでは何も変わらない):
#   1. GPU 容量実測 (docs §5-1) 完了・icstv-yt-mirror-encoder@ch1 が実際に YouTube へ送出できていることを
#      YouTube Studio で確認してから。
#   2. mkdir -p /etc/systemd/system/icstv-encoder@ch1.service.d/
#      cp override.conf /etc/systemd/system/icstv-encoder@ch1.service.d/override.conf
#   3. systemctl daemon-reload && systemctl restart icstv-encoder@ch1
#   4. tv.yagamin.net/hls2/ch1 (自前サイト) が継続配信されること、YouTube 公開面が
#      icstv-yt-mirror-encoder@ch1 経由に切り替わっていることを監視下で確認。
#
# ch2 等の他チャンネルにはこの drop-in を置かない (このファイルは instance 名 (ch1) に紐づく
# ディレクトリ名 icstv-encoder@ch1.service.d/ に置いたときのみ ch1 の instance だけへ適用される
# systemd の仕組みを利用している。共有テンプレート icstv-encoder@.service 自体は変更しない)。
[Service]
# ExecStart= を空にしてから再定義するのが systemd drop-in の作法 (単純に追記すると2つ実行される)。
ExecStart=
ExecStart=/usr/bin/ffmpeg -hide_banner -loglevel warning \
  -fflags +genpts -thread_queue_size 1024 \
  -i udp://127.0.0.1:${UDP_PORT}?fifo_size=1000000&overrun_nonfatal=1 \
  -vaapi_device /dev/dri/renderD128 \
  -vf format=nv12,hwupload \
  -c:v h264_vaapi -b:v ${VBITRATE} -maxrate ${VBITRATE} -bufsize ${VBUFSIZE} -g ${GOP} -bf 0 \
  -c:a aac -b:a 160k -ar 48000 \
  -flags +global_header -map 0:v -map 0:a \
  -f tee -use_fifo 1 -fifo_options "attempt_recovery=1:recover_any_error=1:drop_pkts_on_overflow=1:recovery_wait_time=1" "[onfail=ignore:f=flv]rtmp://127.0.0.1:1935/hls/${ICSTV_CHANNEL_SLUG}"
