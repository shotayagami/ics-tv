{% extends "members/base_members.html" %}
{% block title %}2段階認証 — ICS-TV{% endblock %}
{% block member_content %}
<div class="mcard">
  <h1>メールの確認コード</h1>
  <p class="mhint">{{ email }} に送信した6桁コードを入力してください。</p>
  <form class="mform" method="post" action="/members/login/2fa/email/" novalidate>
    {% csrf_token %}
    <label for="code">6桁コード</label>
    <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" autofocus>
    <button class="btn" type="submit">ログイン</button>
  </form>
  <form method="post" action="/members/login/2fa/email/" style="margin: 12px 0 0;">
    {% csrf_token %}
    <input type="hidden" name="resend" value="1">
    <button class="btn ghost" type="submit">確認コードを再送する</button>
  </form>
  <div class="mlinks"><a href="/members/login/">ログインに戻る</a></div>
</div>
{% endblock %}
