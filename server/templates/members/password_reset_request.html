{% extends "members/base_members.html" %}
{% block title %}パスワード再設定 — ICS-TV{% endblock %}
{% block member_content %}
<div class="mcard">
  <h1>パスワード再設定</h1>
  <p class="mhint">登録済みのメールアドレスに再設定コードを送ります。</p>
  <form class="mform" method="post" action="/members/password/reset/" novalidate>
    {% csrf_token %}
    {% include "members/_field.html" with field=form.email %}
    <button class="btn" type="submit">再設定コードを送信</button>
  </form>
  <div class="mlinks"><a href="/members/login/">ログインに戻る</a></div>
</div>
{% endblock %}
