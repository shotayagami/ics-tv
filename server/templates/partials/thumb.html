{% comment %}固定サムネ表示 (#7 Phase 2)。引数: url(任意), size(px,既定44)。url があれば img を被せ、無い/読込失敗時は固定 SVG プレースホルダ。{% endcomment %}
{% with s=size|default:44 %}
<span class="thumb" style="position:relative;display:inline-block;flex:none;width:{{ s }}px;height:{{ s }}px;border-radius:4px;overflow:hidden;background:#1d1d1d;border:1px solid var(--line);vertical-align:middle">
  <svg viewBox="0 0 24 24" width="58%" height="58%" fill="none" stroke="#5a5a5a" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round" style="position:absolute;top:21%;left:21%">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>
  </svg>
  {% if url %}<img src="{{ url }}" alt="" loading="lazy"
       style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"
       onerror="this.remove()">{% endif %}
</span>
{% endwith %}
